<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gymmy">
<title>Gymmy</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="app">
  <span class="logo">🏋️</span>
  <div>
    <h1>Gymmy</h1>
    <div class="sub" id="headerSub">Radically Simple Strength</div>
  </div>
</header>

<main>
  <section id="view-train" class="view active"></section>
  <section id="view-nutrition" class="view"></section>
  <section id="view-analytics" class="view"></section>
  <section id="view-coach" class="view"></section>
  <section id="view-settings" class="view"></section>
</main>

<nav class="tabbar">
  <button data-tab="train" class="active"><span class="ic">🏋️</span>Train</button>
  <button data-tab="nutrition"><span class="ic">🍽️</span>Food</button>
  <button data-tab="analytics"><span class="ic">📈</span>Progress</button>
  <button data-tab="coach"><span class="ic">📣</span>Coach</button>
  <button data-tab="settings"><span class="ic">⚙️</span>You</button>
</nav>

<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/charts.js"></script>
<script src="js/training.js"></script>
<script src="js/nutrition.js"></script>
<script src="js/app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
  }
</script>
</body>
</html>
